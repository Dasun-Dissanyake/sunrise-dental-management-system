# ===================================================================
# Sunrise Dental Management System - Application Configuration
# ===================================================================

# Application Information
spring.application.name=sunrise-dental-management-system
server.port=8080

# ===================================================================
# Database Configuration (MySQL)
# Environment variable placeholders are used to avoid hardcoding credentials
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sunrise_dental_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================================================================
# Thymeleaf Web Template Configuration
# ===================================================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# ===================================================================
# Internationalization / Logging Configuration
# ===================================================================
logging.level.org.springframework.web=INFO
logging.level.com.sunrisedental=DEBUG
