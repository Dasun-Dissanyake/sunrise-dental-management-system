<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Edit Patient - Sunrise Dental' : 'Register Patient - Sunrise Dental'}">Register Patient</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="../static/css/styles.css">
</head>
<body>
    <div class="background-glob glob-1"></div>
    <div class="background-glob glob-2"></div>

    <div class="app-container">
        <!-- Header -->
        <header class="navbar">
            <div class="logo-container">
                <span class="logo-icon">☀️</span>
                <span class="logo-text">Sunrise Dental</span>
            </div>
            <nav class="nav-links">
                <a href="/dashboard">Dashboard</a>
                <a href="/patients" class="active">Patients</a>
            </nav>
            <div class="user-profile-nav">
                <span class="user-greeting">
                    Logged in as: <strong th:text="${user.fullName != null && !user.fullName.isBlank() ? user.fullName : user.username}">User</strong>
                </span>
                <span class="role-pill" th:text="${user.role}">ROLE</span>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-sm btn-logout">Logout</button>
                </form>
            </div>
        </header>

        <!-- Main Form Card -->
        <main class="main-content flex-column">
            <div class="form-container-card glass-card">
                <div class="form-header-box">
                    <h2 th:text="${isEdit ? 'Edit Patient Profile' : 'Register New Patient'}">Register Patient</h2>
                    <p class="subtitle" th:if="${!isEdit}">Patient Number will be automatically generated upon submission.</p>
                    <p class="subtitle" th:if="${isEdit}">
                        Patient Number: <strong class="badge-link" th:text="${patientNumber}">PAT-000001</strong>
                    </p>
                </div>

                <form th:action="${isEdit ? '/patients/' + patientId + '/edit' : '/patients/new'}"
                      th:object="${patientRequest}"
                      method="post"
                      class="patient-entry-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label for="fullName">Full Name <span class="required-asterisk">*</span></label>
                            <input type="text" id="fullName" th:field="*{fullName}" class="form-control" placeholder="e.g. Anura Perera" required>
                            <div th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="field-error-msg"></div>
                        </div>

                        <div class="form-group full-width">
                            <label for="address">Address <span class="required-asterisk">*</span></label>
                            <input type="text" id="address" th:field="*{address}" class="form-control" placeholder="e.g. 123 Galle Road, Colombo 03" required>
                            <div th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="field-error-msg"></div>
                        </div>

                        <div class="form-group">
                            <label for="contactNumber">Contact Number <span class="required-asterisk">*</span></label>
                            <input type="text" id="contactNumber" th:field="*{contactNumber}" class="form-control" placeholder="e.g. 0771234567 or +94771234567" required>
                            <div th:if="${#fields.hasErrors('contactNumber')}" th:errors="*{contactNumber}" class="field-error-msg"></div>
                        </div>

                        <div class="form-group">
                            <label for="email">Email Address (Optional)</label>
                            <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="e.g. patient@example.com">
                            <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="field-error-msg"></div>
                        </div>

                        <div class="form-group">
                            <label for="dateOfBirth">Date of Birth (Optional)</label>
                            <input type="date" id="dateOfBirth" th:field="*{dateOfBirth}" class="form-control">
                            <div th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}" class="field-error-msg"></div>
                        </div>

                        <div class="form-group">
                            <label for="gender">Gender (Optional)</label>
                            <select id="gender" th:field="*{gender}" class="form-control">
                                <option value="">Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-actions-row">
                        <a href="/patients" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary" th:text="${isEdit ? 'Save Changes' : 'Register Patient'}">Register Patient</button>
                    </div>
                </form>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2026 Sunrise Dental Management System. Advanced Programming University Project.</p>
        </footer>
    </div>
</body>
</html>
